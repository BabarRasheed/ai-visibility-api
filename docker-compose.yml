version: "3.9"

services:
  api:
    build: .
    container_name: ai_visibility_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=run.py
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DATABASE_URL=${DATABASE_URL:-postgresql://ai_user:ai_pass@db:5432/ai_visibility}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN:-}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD:-}
    volumes:
      # Mount code for live reloading in development
      - .:/app
    command: >
      sh -c "flask db upgrade &&
             flask run --host=0.0.0.0 --port=5000"
    restart: unless-stopped

  # PostgreSQL for production-like setup
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_pass
      POSTGRES_DB: ai_visibility
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
